title: Fanout
footer: learn_buffering — 03 fanout tree
slides:
- type: title
  title: Fanout
  subtitle: One driver cannot feed too many sinks without a buffer tree stage
  notes: One driver cannot feed too many sinks without a buffer tree stage.
- type: bullets
  title: The idea
  bullets:
  - If sink count exceeds max_fanout (two on the toy), insert BUF_X2 at S0
  - Three sinks therefore force an insert
  notes: If sink count exceeds max_fanout (two on the toy), insert BUF_X2 at S0. Three
    sinks therefore force an insert.
