- type: bullets
  title: Implement track
  bullets:
  - Call `fanout_buffer_tree(data, max_fanout=2)`
  - Assert inserted is true
  notes: Call `fanout_buffer_tree(data, max_fanout=2)`. Assert inserted is true.
- type: bullets
  title: Pitfalls
  bullets:
  - Buffering at the driver only
  - Using max_fanout ≥ sink count
  - Forgetting S0 coordinates
  notes: Buffering at the driver only. Using max_fanout ≥ sink count. Forgetting S0
    coordinates.
