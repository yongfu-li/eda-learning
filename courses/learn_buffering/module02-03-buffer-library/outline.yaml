title: Library
footer: learn_buffering — 03 buffer library
slides:
- type: title
  title: Library
  subtitle: Stronger buffers cost input cap but drive with lower resistance
  notes: Stronger buffers cost input cap but drive with lower resistance.
- type: bullets
  title: The idea
  bullets:
  - BUF_X1, BUF_X2, INV_X1 each publish cin, rout, delay, invert
  - Van Ginneken tries each non-inverting cell unless polarity mode allows INV
  notes: BUF_X1, BUF_X2, INV_X1 each publish cin, rout, delay, invert. Van Ginneken
    tries each non-inverting cell unless polarity mode allows INV.
