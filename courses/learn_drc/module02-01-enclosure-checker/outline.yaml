  title: Enclosure
  subtitle: Enclosure rules require VIA (inner) to sit inside metal (outer) by a margin
  notes: Enclosure rules require VIA (inner) to sit inside metal (outer) by a margin.
- type: bullets
  title: The idea
  bullets:
