  title: Seq graph
  subtitle: Retiming starts from a sequential circuit graph , not just a Boolean network
  notes: Retiming starts from a sequential circuit graph — not just a Boolean network.
- type: bullets
  title: The idea
  bullets:
  - Nodes carry combinational delay; edges carry register counts w
  - Our toy has five nodes and five edges
  notes: Nodes carry combinational delay; edges carry register counts w. Our toy has
    five nodes and five edges.
