- type: bullets
  title: Implement track
  bullets:
  - Call `sink_points(placement, sinks)` in `common/ctsutil.py`
  - Print A through F on tiny_cts
  - Assert source at (6,4)
  notes: Call `sink_points(placement, sinks)` in `common/ctsutil.py`. Print A through
