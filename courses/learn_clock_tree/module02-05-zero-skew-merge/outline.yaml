  title: Zero-skew merge
  subtitle: Deferred-merge embedding equalizes delay so opposite arms arrive together
  notes: Deferred-merge embedding equalizes delay so opposite arms arrive together.
- type: bullets
  title: The idea
  bullets:
  - Partition sinks left and right of the source
  - Choose a meeting steiner so left radius plus wire matches right radius plus wire
  - That is the zero-skew intuition
  notes: Partition sinks left and right of the source. Choose a meeting steiner so
