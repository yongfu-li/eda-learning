title: Why proc dff
footer: learn_yosys — 03 proc dff arst
slides:
- type: title
  title: Why proc dff
  subtitle: Sync processes become flip-flops; async reset rides on the ARST ports
  notes: Sync processes become flip-flops; async reset rides on the ARST ports.
- type: bullets
  title: The idea
  bullets:
  - 'GOLDEN: one dollar adff with arst; processes left = 0'
  - Real Yosys binds the same
  notes: 'GOLDEN: one dollar adff with arst; processes left = 0. Real Yosys binds
    the same.'
- type: image
  title: Sync process
  image: assets/steps/01-sync.png
  caption: Sync process
  notes: Posedge clk with async reset.
- type: image
  title: Emit $adff
  image: assets/steps/02-dff.png
  caption: Emit $adff
  notes: Real Yosys emits $adff when async reset is present.
- type: image
  title: ARST port
  image: assets/steps/03-arst.png
  caption: ARST port
  notes: Reset becomes ARST on the $adff.
- type: image
  title: Processes=0
  image: assets/steps/04-done.png
  caption: Processes=0
  notes: All processes lowered.
- type: image
  title: Golden
  image: assets/steps/05-golden.png
  caption: Golden
  notes: 'GOLDEN: type=$adff has_arst=True.'
- type: bullets
  title: Browser lab track
  bullets:
  - Open **proc-dff-arst**
  - Emit the $adff with reset ports, clear all processes, and confirm the real bind
  notes: Open **proc-dff-arst**. Emit the $adff with reset ports, clear all processes,
    and confirm the real bind.
- type: bullets
  title: Implement track
  bullets:
  - Call algo_proc_dff(); assert reg_type is $adff, has_arst is True, processes ==
    0
  - Then run partc_bind.py
  notes: Call algo_proc_dff(); assert reg_type is $adff, has_arst is True, processes
    == 0. Then run partc_bind.py.
- type: bullets
  title: Pitfalls
  bullets:
  - Emitting plain $dff when async reset is present
  - Stopping before processes reach zero
  notes: Emitting plain $dff when async reset is present. Stopping before processes
    reach zero.
- type: bullets
  title: Try these
  bullets:
  - From the common folder
  notes: From the common folder, run the algo solvers self-test, or call `algo_proc_dff`
    and `partc_bind` directly.
- type: code
  title: Try these — try these
  code: 'cd courses/learn_yosys/common

    python3 algo_solvers.py

    python3 partc_bind.py'
  notes: ''
- type: bullets
  title: Pseudocode
  bullets:
  - Here is the check in plain steps
  notes: Here is the check in plain steps.
- type: code
  title: Pseudocode — try these
  code: "run proc_mux first\nfor each sync process:\n  if reset present: emit $adff\
    \ (CLK,D,Q,ARST)\n  else: emit $dff (CLK,D,Q)\nok if reg_type==$adff and processes==0"
  notes: ''
