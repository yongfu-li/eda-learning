slides:
- type: title
  title: Why RTLIL C++
  subtitle: Browser IR and JSON are maps
  notes: Browser IR and JSON are maps. Real Yosys stores the same ideas as C++ objects
    in RTLIL.
- type: bullets
  title: The idea
  bullets:
  - 'GOLDEN: Design owns Modules; Module owns Wires, Cells, Processes; ports use SigSpec'
  notes: 'GOLDEN: Design owns Modules; Module owns Wires, Cells, Processes; ports
    use SigSpec.'
- type: image
  title: Design
  image: assets/steps/01-design.png
  caption: Design
  notes: Design is the root container for modules.
- type: image
  title: Module
  image: assets/steps/02-module.png
  caption: Module
  notes: Module holds wires, cells, and processes.
- type: image
  title: Wire and Cell
  image: assets/steps/03-wire-cell.png
  caption: Wire and Cell
  notes: Wires are nets; cells are instances with typed ports.
- type: image
  title: SigSpec
  image: assets/steps/04-sigspec.png
  caption: SigSpec
  notes: SigSpec is the bit-accurate connection fabric.
