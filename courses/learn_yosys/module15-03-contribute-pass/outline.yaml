title: Why contribute
footer: learn_yosys — 03 contribute pass
slides:
- type: title
  title: Why contribute
  subtitle: Reading is not enough
  notes: Reading is not enough. A contributor knows where a pass lives and how it
    enters the build.
- type: bullets
  title: The idea
  bullets:
  - 'GOLDEN: add passes/area/name.cc'
  notes: 'GOLDEN: add passes/area/name.cc, register the pass, list it in the Makefile,
    rebuild, yosys -h name.'
- type: image
  title: Tree layout
  image: assets/steps/01-tree.png
  caption: Tree layout
  notes: kernel/ holds RTLIL and Pass; passes/ holds commands.
- type: image
  title: Stub file
  image: assets/steps/02-stub.png
  caption: Stub file
  notes: 'Minimal .cc: headers, struct MyPass, REGISTER_PASS.'
- type: image
  title: Build hook
  image: assets/steps/03-build.png
  caption: Build hook
  notes: Add the object to the Makefile and rebuild.
- type: image
  title: Smoke
  image: assets/steps/04-smoke.png
  caption: Smoke
  notes: yosys -h my_pass proves the command exists.
- type: image
  title: Golden
  image: assets/steps/05-golden.png
  caption: Golden
  notes: 'GOLDEN: path + REGISTER_PASS + build + help smoke.'
- type: bullets
  title: Browser lab track
  bullets:
  - Open **contribute-pass**
  - Assemble the contribute checklist and check
  notes: Open **contribute-pass**. Assemble the contribute checklist and check.
- type: bullets
  title: Implement track
  bullets:
  - Call contribute_pass(); assert checklist length and smoke cmd
  notes: Call contribute_pass(); assert checklist length and smoke cmd.
- type: bullets
  title: Pitfalls
  bullets:
  - Editing only docs
  - Forgetting the build system entry
  - Skipping help smoke
  notes: Editing only docs. Forgetting the build system entry. Skipping help smoke.
- type: bullets
  title: Try these
  bullets:
  - From the common folder, call contribute_pass and print the checklist
  notes: From the common folder, call contribute_pass and print the checklist.
- type: code
  title: Try these — try these
  code: 'cd courses/learn_yosys/common

    python3 -c "from internals_solvers import contribute_pass; print(contribute_pass())"'
  notes: ''
- type: bullets
  title: Pseudocode
  bullets:
  - Here is the contribute checklist in plain steps
  notes: Here is the contribute checklist in plain steps.
- type: code
  title: Pseudocode — try these
  code: 'path ← passes/demo/hello_pass.cc

    REGISTER_PASS(HelloPass)

    add to Makefile; rebuild

    smoke ← yosys -h hello_pass'
  notes: ''
