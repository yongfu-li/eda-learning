title: Why Yosys
footer: learn_yosys — 00 intro
slides:
- type: title
  title: Why Yosys
  subtitle: Learn_yosys has four parts
  notes: 'learn_yosys has four parts: Part A is the interactive pass map; Part B drives
    real Yosys on tiny_and_or.v; Part C teaches algorithms bound to real evidence;
    Part D orients you to the Yosys C++ tree so you can contribute.'
- type: bullets
  title: Part A pass map
  bullets:
  - Pass map on tiny_yosys
  notes: 'Pass map on tiny_yosys: 6 cells; flatten→1; opt→5; strash→4; rewrite→3;
    nand 6/7 — same pass names as Yosys, in the browser.'
- type: bullets
  title: Part B real Yosys
  bullets:
  - 'Part B: real binary, RTLIL cells, and checked-in goldens from Yosys 0.9 on tiny_and_or.v'
  notes: 'Part B: real binary, RTLIL cells, and checked-in goldens from Yosys 0.9
    on tiny_and_or.v.'
- type: bullets
  title: Part C algorithms
  bullets:
  - 'Part C: proc_mux, proc_dff ($adff), opt, techmap, extract, memory, fsm'
  notes: 'Part C: proc_mux, proc_dff ($adff), opt, techmap, extract, memory, fsm,
    and ABC handoff — each bound to real Yosys stats.'
- type: bullets
  title: Part D internals
  bullets:
  - 'Part D: RTLIL C++ pillars, Pass registration, reading opt_clean'
  notes: 'Part D: RTLIL C++ pillars, Pass registration, reading opt_clean, and a contribute
    checklist — orientation, not a full Yosys clone.'
- type: bullets
  title: Implement track
  bullets:
  - Implement track
  - Browser labs mirror each part
  notes: 'Implement track: common/solvers.py, real_solvers.py, algo_solvers.py plus
    partc_bind.py, and internals_solvers.py. Browser labs mirror each part.'
- type: bullets
  title: Browser lab track
  bullets:
  - Open the course labs
  - Start at the pass-map proc lab, continue into CLI, algorithms, then internals
  notes: Open the course labs. Start at the pass-map proc lab, continue into CLI,
    algorithms, then internals.
- type: bullets
  title: Next
  bullets:
