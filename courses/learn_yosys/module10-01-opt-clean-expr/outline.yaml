title: Why opt clean
footer: learn_yosys — 01 opt clean expr
slides:
- type: title
  title: Why opt clean
  subtitle: Dead logic and constant buffers waste cells; clean and fold shrink the
    netlist
  notes: Dead logic and constant buffers waste cells; clean and fold shrink the netlist.
- type: bullets
  title: The idea
  bullets:
  - 'GOLDEN: opt_clean removed=2; opt_expr folded=1'
  notes: 'GOLDEN: opt_clean removed=2; opt_expr folded=1.'
- type: image
  title: Dead cells
  image: assets/steps/01-scan.png
  caption: Dead cells
  notes: OR to dead and BUF const0.
- type: image
  title: opt_clean
  image: assets/steps/02-clean.png
  caption: opt_clean
  notes: Remove 2 unused cells.
- type: image
  title: opt_expr
  image: assets/steps/03-expr.png
  caption: opt_expr
  notes: Fold const0 BUF.
- type: image
  title: Keep live
  image: assets/steps/04-keep.png
  caption: Keep live
  notes: Mux/DFF/ANDs that fan out stay.
- type: image
  title: Golden
  image: assets/steps/05-golden.png
  caption: Golden
  notes: 'GOLDEN: removed=2 folded=1.'
- type: bullets
  title: Browser lab track
  bullets:
  - Open **opt-clean-expr**
  - Remove dead cells and fold the const0 buffer
  notes: Open **opt-clean-expr**. Remove dead cells and fold the const0 buffer.
- type: bullets
  title: Implement track
  bullets:
  - Call algo_opt_clean(); assert removed_count == 2
  - Call algo_opt_expr(); assert folded_count == 1
  notes: Call algo_opt_clean(); assert removed_count == 2. Call algo_opt_expr(); assert
    folded_count == 1.
- type: bullets
  title: Pitfalls
  bullets:
  - Deleting live fanout
  - Counting fold after clean already dropped the buffer
  notes: Deleting live fanout. Counting fold after clean already dropped the buffer.
- type: bullets
  title: Try these
  bullets:
  - From the common folder, run the algo solvers self-test, or call `algo_opt_clean`
    directly
  notes: From the common folder, run the algo solvers self-test, or call `algo_opt_clean`
    directly.
- type: code
  title: Try these — try these
  code: 'cd courses/learn_yosys/common

    python3 algo_solvers.py'
  notes: ''
- type: bullets
  title: Pseudocode
  bullets:
  - Here is the check in plain steps
  notes: Here is the check in plain steps.
- type: code
  title: Pseudocode — try these
  code: 'mark used nets from POs backward

    drop cells whose Y/Q never used (keep mux/dff)

    fold dollar buf tied to const0

    ok if removed==2 and folded==1'
  notes: ''
