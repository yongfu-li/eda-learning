slides:
- type: title
  title: Why contribute
  subtitle: Reading is not enough
  notes: Reading is not enough. A contributor knows where a command lives and how
    it enters the build.
- type: bullets
  title: The idea
  bullets:
  - Add app/HelloCmd.cc, register the Tcl command, hook CMake, rebuild, sta -help
    hello_cmd
  notes: 'GOLDEN: add app/HelloCmd.cc, register the Tcl command, hook CMake, rebuild,
    sta -help hello_cmd.'
