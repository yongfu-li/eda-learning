- type: code
  title: Try these — try these
  code: 'cd courses/learn_opensta/common

    python3 -c "from internals_solvers import contribute_opensta; print(contribute_opensta())"'
  notes: ''
- type: bullets
  title: Pseudocode
  bullets:
  - Here is the contribute checklist in plain steps
  notes: Here is the contribute checklist in plain steps.
- type: code
  title: Pseudocode — try these
  code: 'path ← app/HelloCmd.cc

    register Tcl cmd hello_cmd

    add to CMake; rebuild

    smoke ← sta -help hello_cmd'
  notes: ''
