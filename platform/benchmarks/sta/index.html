<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STA benchmark — EDA Algorithms Platform</title>
  <link rel="stylesheet" href="../../assets/site.css">

  <style>
    .bench-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      font-size: 0.92rem;
    }
    .bench-controls fieldset {
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 0;
      padding: 0.4rem 0.65rem 0.55rem;
    }
    .bench-controls legend {
      padding: 0 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .bench-controls label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0.15rem 0.55rem 0.15rem 0;
      white-space: nowrap;
    }
    .rank-table tr.is-selected td { background: rgba(15, 107, 92, 0.12); }
    .rank-table tr.is-user td { background: rgba(180, 83, 9, 0.06); }
    .rank-table tr.is-user.is-selected td { background: rgba(180, 83, 9, 0.16); }
    .rank-table tr[data-algo] { cursor: pointer; }
    .rank-table .num {
      font-variant-numeric: tabular-nums;
      font-family: var(--mono, ui-monospace, Menlo, Consolas, monospace);
    }
    .bench-upload { margin: 1rem 0 1.25rem; }
    .bench-upload textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.5rem;
      background: #fff;
    }
    .bench-upload input[type="text"] {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }
    .bench-example-row {
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
    }
    .bench-example-pick {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
    }
    .bench-example-pick select {
      min-width: 14rem;
      max-width: min(28rem, 100%);
    }
    canvas.bench-scatter {
      display: block;
      width: 100%;
      height: 480px;
      max-height: min(480px, 55vh);
      min-height: 320px;
      background: #ffffff;
      border: 1px solid #000;
    }
    .bench-scatter-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .bench-scatter-head h2 { margin: 0; }
    .bench-part-meta { margin: 0.35rem 0 0.75rem; font-size: 0.9rem; }
    canvas.cluster-canvas {
      display: block;
      width: 100%;
      height: 420px;
      min-height: 280px;
      background: #ffffff;
      border: 1px solid #000;
    }
  </style>
</head>
