<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partitioning benchmark — EDA Algorithms Platform</title>
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="../../assets/tools-shared.css">
  <link rel="stylesheet" href="../../assets/clustering-lab.css">
  <style>
    .bench-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      font-size: 0.92rem;
    }
    .bench-controls fieldset {
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 0;
      padding: 0.4rem 0.65rem 0.55rem;
    }
    .bench-controls legend {
      padding: 0 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .bench-controls label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0.15rem 0.55rem 0.15rem 0;
      white-space: nowrap;
    }
    .bench-controls select,
    .bench-controls input[type="number"] {
      min-width: 4rem;
      max-width: 12rem;
    }
    .rank-table tr.is-selected td {
      background: rgba(15, 107, 92, 0.12);
    }
    .rank-table tr.is-user td {
      background: rgba(180, 83, 9, 0.06);
    }
    .rank-table tr.is-user.is-selected td {
      background: rgba(180, 83, 9, 0.16);
    }
    .rank-table tr[data-algo] {
      cursor: pointer;
    }
    .rank-table .num {
      font-variant-numeric: tabular-nums;
      font-family: var(--mono, ui-monospace, Menlo, Consolas, monospace);
    }
    .bench-upload {
      margin: 1rem 0 1.25rem;
    }
    .bench-upload textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.5rem;
      background: #fff;
    }
    .bench-upload input[type="text"] {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }
    .bench-example-row {
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
    }
    .bench-example-pick {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
    }
    .bench-example-pick select {
      min-width: 14rem;
      max-width: min(28rem, 100%);
    }
    .bench-scatter-wrap {
      margin-top: 1rem;
    }
    canvas.bench-scatter {
      display: block;
      width: 100%;
      height: 520px;
      max-height: min(520px, 60vh);
      min-height: 360px;
      background: #ffffff;
      border: 1px solid #000;
    }
    .bench-scatter-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .bench-scatter-head h2 {
      margin: 0;
    }
    .bench-stack {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 0.5rem;
    }
    .bench-stack > .panel {
      width: 100%;
    }
    .bench-part-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.5rem;
      margin: 0.35rem 0 0.75rem;
    }
    .bench-part-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #fff;
      color: #0f172a;
    }
    .bench-part-pill.muted {
      font-weight: 500;
      color: var(--muted, #64748b);
    }
    canvas.bench-partition {
      display: block;
      width: 100%;
      height: 440px;
      max-height: min(440px, 55vh);
      min-height: 320px;
      background: #ffffff;
      border: 1px solid #000;
      border-radius: 0;
    }
    .bench-table-scroll {
      overflow-x: auto;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .bench-metrics-table {
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .bench-metrics-table th,
    .bench-metrics-table td {
      padding: 0.28rem 0.4rem;
    }
    .bench-metric-h {
      margin: 1rem 0 0.4rem;
      font-size: 1rem;
    }
    .bench-metric-dl {
      display: grid;
      grid-template-columns: minmax(9rem, 14rem) 1fr;
      gap: 0.25rem 0.75rem;
      margin: 0 0 0.75rem;
      font-size: 0.86rem;
    }
    .bench-metric-dl dt {
      margin: 0;
      color: var(--muted, #64748b);
      font-weight: 600;
    }
    .bench-metric-dl dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
